name: Tests

on:
  push:
    branches:
      - main
      - ng
  pull_request:
    branches:
      - main
      - ng

permissions:
  contents: read

jobs:
  lint:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"
      - run: pip install "homeassistant==2026.7.4" -r requirements.txt -r requirements_lint.txt
      - run: pre-commit run --all-files --hook-stage manual --config .github/pre-commit-config.yaml

  tests:
    name: Pytest (Home Assistant 2026.7.4)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"
      - run: pip install "homeassistant==2026.7.4" -r requirements.txt -r requirements_lint.txt
      - run: python -c "from homeassistant.const import __version__; assert __version__ == '2026.7.4'"
      - run: pytest tests/ -q

  release-gates:
    name: Offline release gates (Home Assistant 2026.7.4)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"
      - run: pip install "homeassistant==2026.7.4" -r requirements.txt -r requirements_lint.txt
      - run: python scripts/release_gate.py --check-installed
      - run: pytest tests/test_release_gates.py -q
